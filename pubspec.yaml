name: grumpy_skies
description: A funny persona-based weather app.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # HTTP & storage
  http: ^1.6.0
  shared_preferences: ^2.2.3
  geolocator: ^14.0.2
  crypto: ^3.0.7
  # Selected-location IANA/DST conversion; no location or network access.
  timezone: ^0.10.1
  intl: 0.20.2
  # Local meme documents, personal media, and platform export (no backend).
  path_provider: ^2.1.6
  idb_shim: ^2.9.9
  image_picker: ^1.2.3
  share_plus: 11.1.0
  file_selector: ^1.1.0
  gal: ^2.3.3
  web: ^1.1.1

  # State mgmt (simple)
  provider: ^6.1.2
  go_router: ^14.8.1

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: 6.3.2

  # Icons and SVG support
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  weather_icons_animated: ^0.0.2
  lottie: ^3.4.0
  google_mobile_ads: 9.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DaymakerSans
      fonts:
        - asset: assets/fonts/daymaker/Roboto-Regular.ttf
        - asset: assets/fonts/daymaker/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/daymaker/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/daymaker/Roboto-Black.ttf
          weight: 900
    - family: MemeSans
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: MemeMono
      fonts:
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
  assets:
    - assets/approved_v1/personas/
    - assets/approved_v1/weather/
    - assets/approved_v1/memes/
    - assets/monetization/
    - assets/fonts/
    - assets/
    - assets/backgrounds/about/
    - assets/backgrounds/forecast/
    - assets/backgrounds/fun/
    - assets/backgrounds/meme/
    - assets/backgrounds/radar/
    - assets/backgrounds/reveal/
    - assets/backgrounds/roasts/
    - assets/backgrounds/settings/
    - assets/backgrounds/splash/
    - assets/badges/
    - assets/brand/
    - assets/fun/
    - assets/icons/controls/
    - assets/icons/fun/
    - assets/icons/metrics/
    - assets/icons/nav/
    - assets/icons/settings/
    - assets/icons/status/
    - assets/icons/weather/
    - assets/mascots/
    - assets/meme_backgrounds/
    - assets/meme_stickers/
    - assets/meme_thumbnails/
    - assets/meme_content/
    - assets/personas/
    - assets/personas/karen/
    - assets/personas/frat_bro/
    - assets/personas/politician/
    - assets/personas/grandpa/
    - assets/personas/two_year_old/
    - assets/radar/
    - assets/roasts/roast_pack_v1.json
    - assets/textures/
