name: grumpy_skies
description: A funny persona-based weather app.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # HTTP & storage
  http: ^1.2.0
  shared_preferences: ^2.2.3
  geolocator: ^14.0.2

  # State mgmt (simple)
  provider: ^6.1.2
  go_router: ^14.8.1

  # Maps
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Icons and SVG support
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/backgrounds/about/
    - assets/backgrounds/forecast/
    - assets/backgrounds/fun/
    - assets/backgrounds/meme/
    - assets/backgrounds/radar/
    - assets/backgrounds/reveal/
    - assets/backgrounds/roasts/
    - assets/backgrounds/settings/
    - assets/backgrounds/splash/
    - assets/badges/
    - assets/brand/
    - assets/fun/
    - assets/icons/controls/
    - assets/icons/fun/
    - assets/icons/metrics/
    - assets/icons/nav/
    - assets/icons/settings/
    - assets/icons/status/
    - assets/icons/weather/
    - assets/mascots/
    - assets/meme_backgrounds/
    - assets/meme_stickers/
    - assets/personas/
    - assets/radar/
    - assets/textures/
