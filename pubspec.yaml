name: grumpy_skies
description: A funny persona-based weather app.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & storage
  http: ^1.2.0
  shared_preferences: ^2.2.3

  # State mgmt (simple)
  provider: ^6.1.2

  # Icons and SVG support
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
